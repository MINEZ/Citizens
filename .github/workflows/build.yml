# MINEZ：本 fork 的构建。每次推送都构建插件 jar 并上传为 Artifact，发 Release 时从这里取 jar 作为附件。
# Citizens 对 Spigot 服务端编译，而 Spigot 服务端 jar 不在任何公开的 Maven 仓库中，只能用 BuildTools 在本地生成：
# 这里按版本生成并存进 Actions 缓存，缓存命中时跳过。第三方 action 固定到提交：标签可以被移动，而这里构建出的 jar 会部署到服务器上。
name: Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '构建号，留空时取 .github/build-number 中的值；只在需要临时改用别的构建号时填写'
        required: false
  push:
    branches:
      - master
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
  # Actions 缓存 7 天没有用到就会被清除，重新生成 Spigot 很慢。每周构建一次，免得缓存过期。
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# 同一分支上有新的推送时，取消还在运行的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Citizens
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # 版本与 pom.xml 中 craftbukkit.version 对应的 Minecraft 版本一致；新增或去掉版本时一并修改，缓存键随之变化。
      - name: Restore Spigot
        id: spigot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-26.1.2-26.2-26.3-v1

      - name: Build Spigot
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          for version in 26.1.2 26.2 26.3; do
            java -jar BuildTools.jar --rev "$version" --compile spigot --disable-java-check
          done

      # 其余依赖（Paper、CitizensAPI 等）另行缓存，不含上面的 Spigot。
      - name: Restore Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/spigotmc
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # 构建号写在 .github/build-number 中，格式为 <上游构建号>.<Fork 修订号>，例如 4269.1。它决定插件版本与 jar 的文件名，
      # 同步上游或改了代码时一并修改（与 Geyser 的 minezRevision 相同）；文件在本 fork 独有的 .github 中，同步上游时不会冲突。
      - name: Build
        run: |
          build_number="${BUILD_NUMBER:-$(tr -d '[:space:]' < .github/build-number)}"
          if ! [[ "$build_number" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "构建号“$build_number”的格式不对，应为 <上游构建号>.<Fork 修订号>，例如 4269.1" >&2
            exit 1
          fi
          mvn -B clean package -DBUILD_NUMBER="$build_number"
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}

      - name: Upload Citizens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Citizens
          path: dist/target/Citizens-*.jar
          if-no-files-found: error
